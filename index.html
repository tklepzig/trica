<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#23400f" />
    <meta
      name="viewport"
      content="user-scalable=yes, initial-scale=1.0, maximum-scale=10.0, width=device-width"
    />
    <title>Trica</title>
    <link href="style.min.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js");
        });
      }
    </script>
    <script type="module" src="ui.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="app-bar">
        <div class="compound-commands">
          <button
            type="button"
            class="command"
            id="clear"
            data-label="Löschen"
            data-abbr="Lösch"
          ></button>
          <button
            type="button"
            class="command"
            id="theme"
            data-label="Hell"
            data-abbr="Hell"
          ></button>
        </div>
      </header>

      <div class="layout">
        <!-- Eingaben -->
        <section class="panel inputs">
          <header>Eingaben</header>
          <article>
            <div class="group" id="group-sides">
              <p class="group-title">Seiten</p>
              <div class="field">
                <label class="field-label" for="f-a">a</label>
                <div class="field-control">
                  <input
                    class="input"
                    id="f-a"
                    data-key="a"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Seite a"
                  />
                </div>
                <span class="auto-tag">auto</span>
              </div>
              <div class="field">
                <label class="field-label" for="f-b">b</label>
                <div class="field-control">
                  <input
                    class="input"
                    id="f-b"
                    data-key="b"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Seite b"
                  />
                </div>
                <span class="auto-tag">auto</span>
              </div>
              <div class="field">
                <label class="field-label" for="f-c">c</label>
                <div class="field-control">
                  <input
                    class="input"
                    id="f-c"
                    data-key="c"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Seite c"
                  />
                </div>
                <span class="auto-tag">auto</span>
              </div>
            </div>

            <div class="group" id="group-angles">
              <p class="group-title">Winkel</p>
              <div class="field">
                <label class="field-label" for="f-A">A</label>
                <div class="field-control has-unit">
                  <input
                    class="input"
                    id="f-A"
                    data-key="A"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Winkel A"
                  />
                  <span class="unit">&deg;</span>
                </div>
                <span class="auto-tag">auto</span>
              </div>
              <div class="field">
                <label class="field-label" for="f-B">B</label>
                <div class="field-control has-unit">
                  <input
                    class="input"
                    id="f-B"
                    data-key="B"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Winkel B"
                  />
                  <span class="unit">&deg;</span>
                </div>
                <span class="auto-tag">auto</span>
              </div>
              <div class="field">
                <label class="field-label" for="f-C">C</label>
                <div class="field-control has-unit">
                  <input
                    class="input"
                    id="f-C"
                    data-key="C"
                    inputmode="decimal"
                    autocomplete="off"
                    aria-label="Winkel C"
                  />
                  <span class="unit">&deg;</span>
                </div>
                <span class="auto-tag">auto</span>
              </div>
            </div>

            <button
              type="button"
              class="command solve-mobile"
              id="solve"
              disabled
            >
              = Berechnen
            </button>

            <p class="status" id="status" hidden></p>
          </article>
          <footer>
            <span class="convention"
              >Seite <em>a</em> liegt gegenüber Winkel <em>A</em></span
            >
          </footer>
        </section>

        <!-- Diagramm -->
        <section class="panel diagram">
          <header>
            <span>Diagramm</span>
            <div
              class="compound-commands solution-toggle"
              id="solutionToggle"
              hidden
            >
              <button type="button" class="command" data-solution="0">
                Lösung 1
              </button>
              <button type="button" class="command outline" data-solution="1">
                Lösung 2
              </button>
            </div>
          </header>
          <article id="diagram"></article>
          <footer></footer>
        </section>

        <!-- Ergebnisse -->
        <section class="panel results" id="resultsPanel" hidden>
          <header>Ergebnisse</header>
          <article class="result-grid" id="results"></article>
          <footer></footer>
        </section>
      </div>
    </main>
  </body>
</html>
